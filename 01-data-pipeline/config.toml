# Universe, series and check thresholds. Thresholds are learning defaults.

[settings]
lookback_days = 10          # calendar days fetched before the target date

[checks]
stale_sessions = 3          # unchanged close for this many sessions
outlier_return = 0.15       # absolute daily move, equity and ETF
outlier_curve_bp = 50       # absolute daily move, curve tenor
unusual_sigma = 4           # move against its own normal size
unusual_window = 250        # earlier sessions used for the normal size
unusual_min_history = 60
duplicate_tolerance = 0.001 # relative difference between two sources

[curve]
id = "UST_PAR"
calendar = "bond"
lag = 0
required_tenors = [3, 6, 12, 24, 36, 60, 84, 120, 240, 360]   # months

# lag = business days between the observation date and normal publication
[[series]]
id = "SOFR"
source = "nyfed"
calendar = "bond"
lag = 1

[[series]]
id = "BAMLC0A0CM"           # US investment grade OAS, percent
source = "fred"
calendar = "nyse"           # published on Veterans Day 2026, unlike the par curve
lag = 1

[[series]]
id = "BAMLH0A0HYM2"         # US high yield OAS, percent
source = "fred"
calendar = "nyse"
lag = 1

